<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — AroraCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a href="/index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">AroraCart</span></a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Store</a></li>
        <li><a href="/cart.html" class="nav-link active">🛒 Cart <span id="cart-badge" class="cart-badge">0</span></a></li>
        <li><a href="/wishlist.html" class="nav-link">♥ Wishlist <span id="wishlist-badge" class="wishlist-badge">0</span></a></li>
        <li id="auth-nav-container" class="auth-nav-slot"></li>
      </ul>
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle mobile menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
    <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true">
      <a href="/index.html" class="mobile-nav-link">🏠 Store</a>
      <a href="/cart.html" class="mobile-nav-link active">🛒 Cart</a>
      <a href="/wishlist.html" class="mobile-nav-link">♥ Wishlist</a>
      <a href="/orders.html" class="mobile-nav-link">📦 Orders</a>
    </div>
  </header>

  <main class="container fade-in">
    <div id="cart-page-container">
      <div class="skeleton-order-card" aria-hidden="true"><div class="skeleton skeleton-text full" style="height:3rem;"></div></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-copy"><p>© 2026 AroraCart Inc. All Rights Reserved.</p></div>
    </div>
  </footer>

  <div id="toast-container" aria-live="assertive"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/cart-page.js"></script>
  <script>
    // Mobile hamburger
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('hamburger-btn');
      const drawer = document.getElementById('mobile-nav-drawer');
      if (btn && drawer) {
        btn.addEventListener('click', () => {
          const isOpen = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!isOpen));
          drawer.setAttribute('aria-hidden', String(isOpen));
          btn.classList.toggle('open', !isOpen);
          drawer.classList.toggle('open', !isOpen);
        });
      }
    });
  </script>
</body>
</html>
