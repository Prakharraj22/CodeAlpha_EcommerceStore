<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AroraCart</title>
  <meta name="description" content="Log in to your AroraCart account to view orders, manage wishlist, and checkout faster." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a href="/index.html" class="logo">
        <span class="logo-icon">⚡</span><span class="logo-text">AroraCart</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Store</a></li>
      </ul>
    </nav>
  </header>

  <main class="container fade-in">
    <div class="auth-card">
      <div class="auth-card-logo">⚡</div>
      <h1 class="auth-heading">Welcome Back</h1>
      <p class="auth-subtext">Log in to access your orders, wishlist, and faster checkout.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control"
                 placeholder="user@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" class="form-control"
                   placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('login-password', this)"
                    aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div id="login-error" class="form-error" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="login-submit-btn">
          Sign In
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <div class="auth-footer">
        <p>New to AroraCart? <a href="/register.html" class="auth-link">Create a free account →</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-copy"><p>© 2026 AroraCart Inc. All Rights Reserved.</p></div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁️' : '🙈';
    }
  </script>
</body>
</html>
