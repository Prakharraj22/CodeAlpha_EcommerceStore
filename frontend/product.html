<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — AroraCart</title>
  <meta name="description" content="View product details, specifications, customer reviews, and related products on AroraCart." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="header">
    <nav class="navbar">
      <a href="/index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">AroraCart</span>
      </a>

      <div class="search-box" role="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search products…" onkeydown="if(event.key==='Enter'){ window.location.href='/index.html?q=' + encodeURIComponent(this.value); }" />
      </div>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Store</a></li>
        <li>
          <a href="/cart.html" class="nav-link">
            <span class="nav-icon">🛒</span> Cart
            <span id="cart-badge" class="cart-badge">0</span>
          </a>
        </li>
        <li>
          <a href="/wishlist.html" class="nav-link">
            <span class="nav-icon">♥</span> Wishlist
            <span id="wishlist-badge" class="wishlist-badge">0</span>
          </a>
        </li>
        <li id="auth-nav-container" class="auth-nav-slot"></li>
      </ul>

      <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle mobile menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true">
      <a href="/index.html" class="mobile-nav-link">🏠 Store</a>
      <a href="/cart.html" class="mobile-nav-link">🛒 Cart</a>
      <a href="/wishlist.html" class="mobile-nav-link">♥ Wishlist</a>
      <a href="/orders.html" class="mobile-nav-link">📦 Orders</a>
    </div>
  </header>

  <main class="container fade-in">
    <div id="product-detail-container">
      <!-- Populated by product.js -->
    </div>
  </main>

  <!-- Recently Viewed Products -->
  <div id="recently-viewed-container" style="max-width:1200px;margin:0 auto;padding:0 1.5rem 2rem;"></div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="logo-text">⚡ AroraCart</span>
        <p>India's Premium Tech &amp; Electronics Marketplace</p>
      </div>
      <div class="footer-copy"><p>© 2026 AroraCart Inc. All Rights Reserved.</p></div>
    </div>
  </footer>

  <!-- Sticky Add-to-Cart Bar (appears on scroll) -->
  <aside id="sticky-buy-bar" class="sticky-buy-bar" aria-label="Quick Checkout Bar">
    <div class="sticky-buy-left">
      <img id="sticky-thumb" src="" alt="Product" class="sticky-buy-thumb" />
      <div>
        <div id="sticky-title" class="sticky-buy-title">Product</div>
        <div id="sticky-price" class="sticky-buy-price">₹0</div>
      </div>
    </div>
    <div style="display:flex;gap:0.75rem;">
      <button class="btn btn-primary" onclick="window.addDetailToCart()" id="sticky-cart-btn">
        Add to Cart
      </button>
    </div>
  </aside>

  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/recentlyViewed.js"></script>
  <script src="/js/interactiveModals.js"></script>
  <script src="/js/product.js"></script>
  <script src="/js/demoMode.js"></script>
</body>
</html>
