<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AroraCart</title>
  <meta name="description" content="Create your free AroraCart account and get access to exclusive deals, wishlist, and fast checkout." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a href="/index.html" class="logo">
        <span class="logo-icon">⚡</span><span class="logo-text">AroraCart</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Store</a></li>
      </ul>
    </nav>
  </header>

  <main class="container fade-in">
    <div class="auth-card auth-card-wide">
      <div class="auth-card-logo">⚡</div>
      <h1 class="auth-heading">Create Account</h1>
      <p class="auth-subtext">Join AroraCart for exclusive deals, order tracking, and wishlist sync.</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control"
                 placeholder="Prakhar Raj" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control"
                 placeholder="user@example.com" autocomplete="email" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="reg-password" class="form-control"
                     placeholder="Min. 6 characters" autocomplete="new-password" required />
              <button type="button" class="toggle-password-btn"
                      onclick="togglePasswordVisibility('reg-password', this)" aria-label="Toggle password">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control"
                   placeholder="Re-enter password" autocomplete="new-password" required />
          </div>
        </div>

        <div id="register-error" class="form-error" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="register-submit-btn">
          Create Account
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login.html" class="auth-link">Sign in →</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-copy"><p>© 2026 AroraCart Inc. All Rights Reserved.</p></div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁️' : '🙈';
    }
  </script>
</body>
</html>
